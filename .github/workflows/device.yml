name: Android device and screenshots
on:
  workflow_call:
  pull_request:
    paths: ['app/**','*.gradle.kts','gradle.properties','.github/workflows/device.yml','scripts/capture-android.py','scripts/test-capture-android.py']
  push:
    branches: [main, feature/native-alpha]
    paths: ['app/**','*.gradle.kts','gradle.properties','.github/workflows/device.yml','scripts/capture-android.py','scripts/test-capture-android.py']
permissions:
  contents: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'
          cache-disabled: true
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools platforms;android-37.1 build-tools;36.0.0"
      - name: Test screenshot selectors
        run: python3 scripts/test-capture-android.py
      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: |
            gradle --stacktrace :app:connectedDebugAndroidTest :app:assembleDebug
            python3 scripts/capture-android.py
            gradle --stacktrace -PfiskaiInstrumentedBuildType=demo -Pandroid.testInstrumentationRunnerArguments.class=hr.brendigo.fiskai.PaymentPreparationInstrumentedTest :app:connectedDemoAndroidTest
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: FiskAI-real-screenshots-api36
          if-no-files-found: error
          path: screenshots/actual/*.png
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: FiskAI-device-test-results
          if-no-files-found: warn
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
            build/capture-diagnostics/

name: Android
on:
  pull_request:
  push:
    branches: [main, feature/native-alpha]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.2'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools platforms;android-37.1 build-tools;36.0.0"
      - run: gradle --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:bundleDebug :app:assembleDemo :app:bundleRelease
      - uses: actions/upload-artifact@v6
        with:
          name: FiskAI-build
          if-no-files-found: error
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/debug/*.aab
            app/build/outputs/apk/demo/*.apk
            app/build/outputs/bundle/release/*.aab

name: Web
on:
  workflow_call:
  pull_request:
    paths: ['web/**','server/**','scripts/test-demo-sync-https.py','scripts/educ-witness.py','scripts/test-educ-witness.py','scripts/educ-witness-https.py','scripts/test-educ-witness-https.py','.github/workflows/web.yml','scripts/check-legal-catalog.py','app/src/main/java/hr/brendigo/fiskai/LegalRuleCatalog.kt']
  push:
    branches: [main, feature/native-alpha]
    paths: ['web/**','server/**','scripts/test-demo-sync-https.py','scripts/educ-witness.py','scripts/test-educ-witness.py','scripts/educ-witness-https.py','scripts/test-educ-witness-https.py','.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: 'mysql:8.4'
            healthcheck: 'mysqladmin ping -h 127.0.0.1'
          - database: 'mariadb:11.4'
            healthcheck: 'healthcheck.sh --connect --innodb_initialized'
    services:
      mysql:
        image: ${{ matrix.database }}
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: fiskai_test
          MARIADB_ROOT_PASSWORD: ci-only-password
          MARIADB_DATABASE: fiskai_test
        ports: ['3306:3306']
        options: --health-cmd="${{ matrix.healthcheck }}" --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      FISKAI_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=fiskai_test;charset=utf8mb4
      FISKAI_DB_USER: root
      FISKAI_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v7
      - run: php -v && php -m
      - run: find web server -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: python3 scripts/check-legal-catalog.py
      - run: php server/tests/LegalComplianceTest.php
      - run: php server/tests/TaxStatusHistoryTest.php
      - run: php server/tests/FiscalReportingRulesTest.php
      - run: php server/tests/PriceListsTest.php
      - run: php server/tests/PriceDownloadTest.php
      - run: php server/tests/DatabaseTest.php
      - run: php server/tests/SchemaMigratorTest.php
      - run: php server/tests/FiscalEventOutboxTest.php
      - run: php server/tests/DemoSyncTest.php
      - run: php server/tests/DemoDeviceProofTest.php
      - run: php server/tests/ServerRecoveryTest.php
      - run: php server/tests/EducExternalCheckpointTest.php
      - run: php server/tests/EducInvoiceMathTest.php
      - run: php server/tests/EducCreditLimitsTest.php
      - run: php server/tests/EducRemoteCheckpointTest.php
      - run: php server/tests/F2InvoicePreflightTest.php
      - run: python3 scripts/test-educ-witness.py
      - run: python3 scripts/test-educ-witness-https.py
      - run: php server/tests/DemoDocumentExchangeTest.php
      - run: python3 scripts/test-demo-sync-https.py
      - run: php server/tests/FiscalContractTest.php
      - run: php server/tests/FiscalSignatureTest.php
      - name: Install XML signature verifier from official Ubuntu sources
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xmlsec1 >/dev/null 2>&1; then
            test -f /etc/apt/sources.list.d/ubuntu.sources
            opts=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
            sudo apt-get "${opts[@]}" update
            sudo apt-get "${opts[@]}" install -y --no-install-recommends xmlsec1
          fi
          xmlsec1 --version
      - run: |
          dir="$(mktemp -d)"
          trap 'rm -rf "$dir"' EXIT
          php server/tests/FiscalSignatureTest.php "$dir"
          xmlsec1 --verify --trusted-pem "$dir/cert.pem" --pubkey-cert-pem "$dir/cert.pem" --id-attr:Id RacunZahtjev "$dir/signed.xml"
          if xmlsec1 --verify --trusted-pem "$dir/cert.pem" --pubkey-cert-pem "$dir/cert.pem" --id-attr:Id RacunZahtjev "$dir/tampered.xml"; then
            echo "Modified XML unexpectedly verified"; exit 1
          fi

name: Web
on:
  pull_request:
    paths: ['web/**','.github/workflows/web.yml']
  push:
    branches: [main, feature/native-alpha]
    paths: ['web/**','.github/workflows/web.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-only-password
          MYSQL_DATABASE: fiskai_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost" --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      FISKAI_DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=fiskai_test;charset=utf8mb4
      FISKAI_DB_USER: root
      FISKAI_DB_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v6
      - run: php -v && php -m
      - run: find web -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php web/tests/PriceListsTest.php
      - run: php web/tests/DatabaseTest.php

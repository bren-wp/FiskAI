name: Official F2 contract candidates
on:
  pull_request:
    paths:
      - '.github/workflows/f2-contract-acquisition.yml'
      - 'scripts/verify-f2-bundle.py'
      - 'scripts/test-f2-bundle.py'
      - 'scripts/accept-f2-contracts.py'
      - 'scripts/test-f2-contract-acceptance.py'
      - 'scripts/validate-f2-uploaded.py'
      - 'scripts/test-f2-uploaded.py'
      - 'scripts/prepare-f2-hr-schematron.py'
      - 'scripts/run-f2-schematron.py'
      - 'scripts/test-f2-dual-schematron.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acquire:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 scripts/test-f2-bundle.py
      - run: python3 scripts/test-f2-contract-acceptance.py
      - name: Acquire original public contracts without executing them
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir f2-contract-candidates
          fetch() {
            local name="$1" id="$2" status
            echo "Fetching public contract $name ($id)"
            status="$(curl --fail --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 120 --silent --show-error --proto '=https' --tlsv1.2 --connect-timeout 10 --max-time 60 --max-filesize 67108864 --output "f2-contract-candidates/$name" --write-out '%{http_code}' "https://porezna.gov.hr/fiskalizacija/api/dokumenti/$id")"
            test "$status" = 200
            echo "Received $name"
            test -s "f2-contract-candidates/$name"
            test "$(wc -c < "f2-contract-candidates/$name")" -le 67108864
          }
          fetch validator-2026-03-13.zip 197
          fetch ubl-2026-04-15.zip 198
          fetch efiskalizacija-2026-02-12.zip 175
          fetch eizvjestavanje-2026-02-12.zip 187
          fetch f2-specification-2026-11-26.pdf 222
          fetch as4-2025-10-07.pdf 140
          fetch mps-2025-10-08.pdf 141
          fetch ams-2025-10-09.pdf 142
      - name: Inventory candidate bytes (not an approval)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import importlib.util
          import json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("bundle", "scripts/verify-f2-bundle.py")
          bundle = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(bundle)
          root = Path("f2-contract-candidates")
          records = {}
          for kind, source in bundle.SOURCES.items():
              path = root / (kind + ".zip")
              with path.open("rb") as stream:
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              # Calculated hash is ONLY a candidate inventory value, never a trusted pin.
              records[path.name] = bundle.verify(path, kind, digest)
          for name, id in {
              "f2-specification-2026-11-26.pdf": 222,
              "as4-2025-10-07.pdf": 140,
              "mps-2025-10-08.pdf": 141,
              "ams-2025-10-09.pdf": 142,
          }.items():
              with (root / name).open("rb") as stream:
                  if stream.read(5) != b"%PDF-":
                      raise ValueError("Unexpected PDF content")
                  stream.seek(0)
                  digest = hashlib.file_digest(stream, "sha256").hexdigest()
              records[name] = {
                  "source": f"https://porezna.gov.hr/fiskalizacija/api/dokumenti/{id}",
                  "sha256": digest,
              }
          (root / "CANDIDATE-INVENTORY.json").write_text(json.dumps({
              "status": "UNREVIEWED_CANDIDATE_ONLY",
              "dispatchAuthorized": False,
              "files": records,
          }, indent=2) + "\n", encoding="utf-8")
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: FiskAI-F2-originals-UNREVIEWED
          path: f2-contract-candidates/
          if-no-files-found: error
          retention-days: 7
      - name: Diagnose exact user-supplied contract version
        shell: bash
        run: |
          set -euo pipefail
          if ! /usr/bin/python3 -c 'import lxml.etree'; then
            test -f /etc/apt/sources.list.d/ubuntu.sources
            opts=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
            sudo apt-get "${opts[@]}" update
            sudo apt-get "${opts[@]}" install -y --no-install-recommends python3-lxml
          fi
          /usr/bin/python3 scripts/test-f2-uploaded.py f2-contract-candidates
          /usr/bin/python3 scripts/validate-f2-uploaded.py f2-contract-candidates > f2-xsd-diagnostics.json
          /usr/bin/python3 scripts/prepare-f2-hr-schematron.py f2-contract-candidates hr-expanded.sch
          /usr/bin/python3 -m py_compile scripts/run-f2-schematron.py
      - uses: actions/upload-artifact@v6
        with:
          name: FiskAI-F2-XSD-diagnostics-NOT-APPROVAL
          path: |
            f2-xsd-diagnostics.json
            hr-expanded.sch
          if-no-files-found: error
          retention-days: 7
  en16931-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ConnectingEurope/eInvoicing-EN16931
          ref: 6e35e0ab8b09eb183f7d84b282e24ef95f9f5715
          persist-credentials: false
          path: en16931-source
      - name: Inventory the official pinned release commit without executing stylesheets
        shell: bash
        run: |
          set -euo pipefail
          cd en16931-source
          test "$(git rev-parse HEAD)" = 6e35e0ab8b09eb183f7d84b282e24ef95f9f5715
          test "$(git hash-object ubl/xslt/EN16931-UBL-validation.xslt)" = e2849ece2a6b9d5cdd163f2e7a89a6dc3d43dc8a
          test "$(git hash-object LICENSE.txt)" = 6881212dba6e221b1b061d2e55da5ca4f40e4e19
          mkdir ../en16931-candidate
          git archive --format=zip --output=../en16931-candidate/en16931-ubl-source.zip HEAD ubl LICENSE.txt README.md
          cp ubl/xslt/EN16931-UBL-validation.xslt LICENSE.txt ../en16931-candidate/
          cd ../en16931-candidate
          printf '%s\n' UNREVIEWED_CANDIDATE_ONLY > STATUS.txt
          sha256sum *.zip *.xslt LICENSE.txt > SHA256SUMS.txt
      - uses: actions/upload-artifact@v6
        with:
          name: FiskAI-EN16931-v1.3.17-UNREVIEWED
          path: en16931-candidate/
          if-no-files-found: error
          retention-days: 7
  dual-schematron-diagnostic:
    needs: [acquire, en16931-candidate]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: FiskAI-F2-originals-UNREVIEWED
          path: f2-contract-candidates
      - uses: actions/download-artifact@v8
        with:
          name: FiskAI-EN16931-v1.3.17-UNREVIEWED
          path: en16931-candidate
      - uses: actions/checkout@v7
        with:
          repository: Schematron/schematron
          ref: 77dcd36c53d12ed786c144ece3b2af7694abdc56
          persist-credentials: false
          path: iso-schematron
      - name: Install pinned diagnostic runtime
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          /usr/bin/python3 -c 'import sys; assert sys.version_info[:2] == (3,12)'
          opts=(-o Dir::Etc::sourcelist=/etc/apt/sources.list.d/ubuntu.sources -o Dir::Etc::sourceparts=- -o Acquire::Retries=3)
          sudo apt-get "${opts[@]}" update
          sudo apt-get "${opts[@]}" install -y --no-install-recommends python3-lxml python3-venv
          /usr/bin/python3 -m venv --system-site-packages .f2-runtime
          printf '%s\n' 'saxonche==12.9.0 --hash=sha256:490f30e9486750f6a066de2b467114dfd6e14d23c8ce645cad64e663f580490a' > f2-runtime.requirements
          .f2-runtime/bin/python -m pip --isolated install --index-url https://pypi.org/simple --require-hashes --only-binary=:all: --no-deps -r f2-runtime.requirements
          test "$(git -C iso-schematron rev-parse HEAD)" = 77dcd36c53d12ed786c144ece3b2af7694abdc56
      - name: Execute both rule sets on synthetic documents in a network namespace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -m 700 diagnostic-home
          sudo unshare --net --setgid "$(id -g)" --setuid "$(id -u)" -- env -i HOME="$PWD/diagnostic-home" PATH=/usr/bin:/bin LANG=C.UTF-8 timeout 180 "$PWD/.f2-runtime/bin/python" scripts/test-f2-dual-schematron.py f2-contract-candidates en16931-candidate/EN16931-UBL-validation.xslt iso-schematron/trunk/schematron/code f2-dual-diagnostics
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: FiskAI-F2-dual-SVRL-NOT-APPROVAL
          path: f2-dual-diagnostics/
          if-no-files-found: warn
          retention-days: 7

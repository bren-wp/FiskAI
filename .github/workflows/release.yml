name: FiskAI 0.1.0 packages
on:
  push:
    branches: [feature/native-alpha]
    paths: ['app/**','server/**','web/**','brending/**','*.gradle.kts','.github/workflows/**']
permissions:
  contents: read
concurrency:
  group: fiskai-release-0-1-0
  cancel-in-progress: false
jobs:
  web:
    uses: ./.github/workflows/web.yml
  device:
    uses: ./.github/workflows/device.yml
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.2'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools platforms;android-37.1 build-tools;36.0.0"
      - name: Build and verify packages
        run: |
          set -euo pipefail
          grep -F 'versionName = "0.1.0"' app/build.gradle.kts
          gradle --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDemo :app:bundleRelease
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FiskAI.apk
          cp app/build/outputs/apk/demo/app-demo.apk dist/demo.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/FiskAI-unsigned.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify dist/FiskAI.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify dist/demo.apk
          if unzip -Z1 dist/FiskAI-unsigned.aab | grep -Ei '^META-INF/[^/]+\.(RSA|DSA|EC|SF)$'; then
            echo "Expected unsigned AAB"; exit 1
          fi
          git archive --format=zip --prefix=FiskAI-0.1.0/ HEAD > dist/FiskAI-0.1.0-source.zip
          (cd dist && sha256sum *.apk *.aab *.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v6
        with:
          name: FiskAI-0.1.0-packages
          path: dist/
          if-no-files-found: error
  publish:
    needs: [web,device,package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: FiskAI-0.1.0-packages
          path: dist
      - uses: actions/download-artifact@v6
        with:
          name: FiskAI-real-screenshots-api36
          path: screenshots
      - name: Publish verified test packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo "Release already exists; no replacement"; exit 0
          fi
          (cd dist && sha256sum -c SHA256SUMS.txt)
          (cd screenshots && zip -q ../dist/FiskAI-real-screenshots.zip *.png)
          (cd dist && sha256sum *.apk *.aab *.zip > SHA256SUMS.txt)
          gh release create v0.1.0 dist/* --target "$GITHUB_SHA" --prerelease --title "FiskAI 0.1.0 — testno izdanje" --notes "Verificirani paketi za testiranje. APK i demo.apk potpisani su testnim ključem, release AAB nije potpisan. Fiskalizacija i eRačuni nisu odobreni za produkciju. Ne koristiti stvarne poslovne podatke. Izvorni kod i stvarne snimke emulatora priloženi."

name: FiskAI release candidate packages
on:
  pull_request:
    paths: ['app/**','server/**','web/**','brending/**','scripts/**','*.gradle.kts','.github/workflows/**']
  workflow_dispatch:
    inputs:
      publish:
        description: 'Objavi tehničko testno izdanje nakon provjere svih priloga'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: fiskai-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    uses: ./.github/workflows/web.yml
  device:
    uses: ./.github/workflows/device.yml
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.9.2'
          cache-disabled: true
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools platforms;android-37.1 build-tools;36.0.0"
      - name: Build and verify packages
        run: |
          set -euo pipefail
          grep -E 'versionName = "[0-9]+\.[0-9]+\.[0-9]+"' app/build.gradle.kts
          gradle --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDemo :app:bundleRelease
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FiskAI.apk
          cp app/build/outputs/apk/demo/app-demo.apk dist/demo.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/FiskAI-unsigned.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify dist/FiskAI.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify dist/demo.apk
          if unzip -Z1 dist/FiskAI-unsigned.aab | grep -Ei '^META-INF/[^/]+\.(RSA|DSA|EC|SF)$'; then
            echo "Expected unsigned AAB"; exit 1
          fi
          gradle --no-configuration-cache -I scripts/runtime-sbom.init.gradle :app:fiskaiRuntimeSbom
          python3 scripts/check-room-schema.py app/build/room-schemas
          cp app/build/room-schemas/compileReleaseJavaWithJavac/hr.brendigo.fiskai.room.FiscalRoomDatabase/7.json dist/FiskAI-room-schema.json
          python3 scripts/package-source.py dist
          cp docs/THIRD_PARTY.md dist/THIRD_PARTY.md
          cp server/README.md dist/INSTALLATION.md
          cp CHANGELOG.md dist/CHANGELOG.md
          (cd dist && sha256sum *.apk *.aab *.zip *.md *.json > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v6
        with:
          name: FiskAI-candidate-packages
          path: dist/
          if-no-files-found: error
  assemble-candidate:
    needs: [web,device,package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: FiskAI-candidate-packages
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: FiskAI-real-screenshots-api36
          path: capture/android
      - name: Verify and assemble candidate
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS.txt)
          for platform in web admin; do
            if [ -d "screenshots/actual/$platform" ]; then
              mkdir -p "capture/$platform"
              find "screenshots/actual/$platform" -maxdepth 1 -type f -name '*.png' -exec cp -- {} "capture/$platform/" \\;
            fi
          done
          (cd capture && zip -qr ../dist/FiskAI-screenshots.zip . -i '*.png')
          (cd dist && unzip -tq FiskAI-screenshots.zip && sha256sum *.apk *.aab *.zip *.md *.json > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v6
        with:
          name: FiskAI-verified-candidate
          path: dist/
          if-no-files-found: error
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.publish == true
    needs: [assemble-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: FiskAI-verified-candidate
          path: dist
      - name: Verify complete artifacts and publish technical test release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 scripts/check-release.py dist
          current="$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)"
          test "$current" = "$GITHUB_SHA"
          version="$(sed -nE 's/^[[:space:]]*versionName = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' app/build.gradle.kts)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if gh release view "v$version" >/dev/null 2>&1; then
            echo "Release already exists; will not replace published assets"
            exit 1
          fi
          gh release create "v$version" dist/* --target "$GITHUB_SHA" --prerelease --title "FiskAI $version — testno izdanje" --notes "Tehnički provjereni testni paketi. APK koristi testni potpis; release AAB nije potpisan. Fiskalizacija, eRačuni i zakonska produkcijska spremnost nisu potvrđeni. Ne koristiti stvarne poslovne podatke."

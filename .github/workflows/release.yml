name: FiskAI release candidate packages
on:
  pull_request:
    paths: ['app/**','server/**','web/**','brending/**','scripts/package-source.py','*.gradle.kts','.github/workflows/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fiskai-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  web:
    uses: ./.github/workflows/web.yml
  device:
    uses: ./.github/workflows/device.yml
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.9.2'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: "platform-tools platforms;android-37.1 build-tools;36.0.0"
      - name: Build and verify packages
        run: |
          set -euo pipefail
          grep -E 'versionName = "[0-9]+\.[0-9]+\.[0-9]+"' app/build.gradle.kts
          gradle --stacktrace :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleDemo :app:bundleRelease
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/FiskAI.apk
          cp app/build/outputs/apk/demo/app-demo.apk dist/demo.apk
          cp app/build/outputs/bundle/release/app-release.aab dist/FiskAI-unsigned.aab
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify dist/FiskAI.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify dist/demo.apk
          if unzip -Z1 dist/FiskAI-unsigned.aab | grep -Ei '^META-INF/[^/]+\.(RSA|DSA|EC|SF)$'; then
            echo "Expected unsigned AAB"; exit 1
          fi
          python3 scripts/package-source.py dist
          cp docs/THIRD_PARTY.md dist/THIRD_PARTY.md
          cp server/README.md dist/INSTALLATION.md
          cp CHANGELOG.md dist/CHANGELOG.md
          (cd dist && sha256sum *.apk *.aab *.zip *.md > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v6
        with:
          name: FiskAI-candidate-packages
          path: dist/
          if-no-files-found: error
  assemble-candidate:
    needs: [web,device,package]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: FiskAI-candidate-packages
          path: dist
      - uses: actions/download-artifact@v6
        with:
          name: FiskAI-real-screenshots-api36
          path: screenshots
      - name: Verify and assemble candidate
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS.txt)
          (cd screenshots && zip -q ../dist/FiskAI-screenshots.zip *.png)
          (cd dist && unzip -tq FiskAI-screenshots.zip && sha256sum *.apk *.aab *.zip *.md > SHA256SUMS.txt && sha256sum -c SHA256SUMS.txt)
      - uses: actions/upload-artifact@v6
        with:
          name: FiskAI-verified-candidate
          path: dist/
          if-no-files-found: error
